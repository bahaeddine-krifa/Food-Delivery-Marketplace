# Food Delivery Platform - Common Configuration
# Base configuration shared across all modules

spring:
  application:
    name: food-delivery-platform

  # Database Configuration (configured via environment variables)
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/food_delivery}
    username: ${DATABASE_USERNAME:food_delivery}
    password: ${DATABASE_PASSWORD:food_delivery}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000

  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 20
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

  # Flyway Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    schemas: public
    table: flyway_schema_history

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  # Mail Configuration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Jackson Configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # Servlet Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: always
    include-binding-errors: always

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Logging Configuration
logging:
  level:
    com.fooddelivery: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/food-delivery.log

# Application-specific Properties
app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-here-must-be-at-least-32-characters-long}
    access-token-expiration: 15m
    refresh-token-expiration: 7d
    remember-me-expiration: 30d
    issuer: food-delivery-platform
    audience: food-delivery-clients

  # File Upload
  upload:
    max-size: 10MB
    allowed-types: image/jpeg,image/png,image/webp
    path: ${UPLOAD_PATH:/tmp/uploads}

  # Email Verification
  email:
    verification:
      base-url: ${EMAIL_VERIFICATION_URL:http://localhost:8080/api/v1/auth/verify-email}
    password-reset:
      base-url: ${PASSWORD_RESET_URL:http://localhost:8080/api/v1/auth/reset-password}

  # Pagination
  pagination:
    default-page-size: 20
    max-page-size: 100

  # Rate Limiting
  rate-limit:
    auth-requests-per-minute: 10
    api-requests-per-minute: 100

  # Delivery
  delivery:
    default-radius-km: 5.0
    offer-timeout-seconds: 60
    auto-assignment-enabled: true

  # Order
  order:
    pending-timeout-minutes: 10
    tax-rate: 0.19

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  packages-to-scan: com.fooddelivery
  default-produces-media-type: application/json
  default-consumes-media-type: application/json